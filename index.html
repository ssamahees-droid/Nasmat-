    <!-- Theme Immediate Bootstrapper to prevent FOUC / light-dark flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('nesmat_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.removeAttribute('data-theme');
          }
          var savedPerf = localStorage.getItem('nesmat_mobile_perf_mode');
          var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (window.innerWidth < 768 && ('ontouchstart' in window || (navigator.maxTouchPoints && navigator.maxTouchPoints > 0)));
          if (savedPerf === 'true' || (savedPerf === null && isMobile)) {
            document.documentElement.classList.add('mobile-low-perf');
          }
        } catch(e) {}
      })();
    </script>
